name: Supabase Keep Alive

on:
  # 定期実行は vercel.json の Vercel Cron へ移行済み。
  # このワークフローは障害調査時の手動実行用として残す。
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install pg dotenv

      - name: Run Keep Alive script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL: 'true'
        run: node scripts/keep-alive.js
